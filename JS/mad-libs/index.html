<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Mad Libs</h1>
    <p class="hint">Fill in every box, then hit Generate.</p>

    <form id="wordForm">
        <label for="adjective">An adjective (silly, enormous, damp)</label>
        <input type="text" id="adjective">

        <label for="noun">A noun (hamster, bicycle, sandwich)</label>
        <input type="text" id="noun">

        <label for="verb">A verb (sprint, yodel, nap)</label>
        <input type="text" id="verb">

        <label for="number">A number</label>
        <input type="text" id="number">

        <label for="name">A person's name</label>
        <input type="text" id="name">
    </form>

    <button id="generateButton" type="button">Generate</button>
    <button id="resetButton" type="button">Reset</button>

    <!-- Your story goes in here. Leave it empty. -->
    <p id="story"></p>

    <script src="script.js" defer></script>
</body>
</html>
